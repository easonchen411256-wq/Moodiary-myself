<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/Moodiary-myself/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0B3B8F">
  <meta name="description" content="Moodiary 是一款以隐私为先的情绪日记，结合 AI 洞察与暖心陪伴，帮助你记录、理解并调节每日心情。">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Moodiary">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=moodiary">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=moodiary-vector"/>

  <title>Moodiary｜AI 情绪陪伴</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #F4F8FD;
      font-family: "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #moodiary-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 72% 22%, rgba(22, 163, 199, .10), transparent 28%),
        radial-gradient(circle at 20% 82%, rgba(23, 105, 224, .08), transparent 30%),
        #F4F8FD;
      transition: opacity .28s ease, visibility .28s ease;
    }

    #moodiary-loading.ready {
      opacity: 0;
      visibility: hidden;
    }

    .loading-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      color: #10213A;
    }

    .loading-logo {
      width: 210px;
      height: 64px;
      display: block;
      filter: drop-shadow(0 14px 22px rgba(11, 59, 143, .18));
      animation: moodiary-pulse 1.4s ease-in-out infinite;
    }

    .loading-logo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .loading-title {
      font-size: 20px;
      font-weight: 750;
      letter-spacing: -.3px;
    }

    .loading-copy {
      margin-top: -8px;
      color: #53647B;
      font-size: 13px;
    }

    @keyframes moodiary-pulse {
      0%, 100% { transform: scale(1); opacity: .94; }
      50% { transform: scale(1.045); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .loading-logo { animation: none; }
    }
  </style>
</head>
<body>
  <div id="moodiary-loading" aria-label="Moodiary 正在加载">
    <div class="loading-card">
      <div class="loading-logo" aria-hidden="true">
        <img src="moodiary-logo.png" alt="">
      </div>
      <div class="loading-copy">正在打开你的情绪空间</div>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('moodiary-loading');
      if (!loader) return;
      loader.classList.add('ready');
      window.setTimeout(() => loader.remove(), 320);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
